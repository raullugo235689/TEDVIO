name: TEDVIO Premium Mobile Diagnostic

on:
  push:
    branches: ['rebuild/tedvio-groups-premium']
    paths:
      - 'apps/teacher-v2/src/features/groups/**'
      - 'apps/teacher-v2/src/styles/groups-premium*.css'
      - 'tests/browser/phase6-groups-compact.spec.mjs'
      - '.github/workflows/groups-premium-mobile-debug.yml'

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build teacher frontend
        working-directory: apps/teacher-v2
        run: |
          npm ci --no-audit --no-fund
          npm run build:teacher
      - name: Install WebKit browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps webkit
      - name: Diagnose 320px viewport
        run: npx playwright test tests/browser/phase6-groups-compact.spec.mjs --config=tests/browser/phase6-playwright.config.mjs --project=iphone-webkit --grep '320px'
