name: Group design review inputs
on:
  push:
    branches: [rebuild/tedvio-2-groups-premium]
    paths: [.github/workflows/groups-premium-review-inputs.yml]
permissions:
  contents: read
jobs:
  review-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=zip --output=groups-review-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: groups-review-source
          path: groups-review-source.zip
          retention-days: 1
