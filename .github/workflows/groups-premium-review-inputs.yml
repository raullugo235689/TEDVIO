name: Group design review inputs
on:
  push:
    branches: [rebuild/tedvio-2-groups-premium]
    paths: [.github/workflows/groups-premium-review-inputs.yml]
permissions:
  contents: read
jobs:
  review-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned visual review dependencies
        run: |
          cd apps/teacher-v2
          npm ci --no-audit --no-fund
          cd ../..
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.55.0
          tar -czf groups-review-deps.tar.gz apps/teacher-v2/node_modules node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: groups-review-deps
          path: groups-review-deps.tar.gz
          retention-days: 1
