name: TEDVIO Pilot Ready Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check v57 smart dashboard syntax
        run: node --check beta-pilot-ready-v57.js
      - name: Check v58 Live Classroom syntax
        run: node --check live-classroom-v58.js
      - name: Check v59 Mobile Classroom syntax
        run: node --check control-v59.js
      - name: Check v60 Student Experience syntax
        run: node --check student-v60.js
      - name: Check v61 Academic Analytics syntax
        run: node --check academic-analytics-v61.js
      - name: Check v62 Admin Institutional Control syntax
        run: node --check admin-v62.js
      - name: Check v62 Account Guard syntax
        run: node --check account-guard-v62.js
      - name: Check v63 Plans Entitlements syntax
        run: node --check entitlements-v63.js
      - name: Check v64 Reliability Performance core syntax
        run: node --check runtime-core-v64.js
      - name: Check v64 stability bridge syntax
        run: node --check beta-session-stability-v1.js
      - name: Check v65 Question Studio syntax
        run: node --check question-studio-v65.js
      - name: Check v66 Assignments teacher syntax
        run: node --check assignments-v66.js
      - name: Check v66 Assignment student syntax
        run: node --check assignment-v66.js
      - name: Check v67 Student Security syntax
        run: node --check student-security-v67.js
      - name: Check v67 Commercial Security syntax
        run: node --check security-commercial-v67.js
      - name: Check v67 Status page syntax
        run: node --check status-v67.js
      - name: Check v68 Onboarding Product Activation syntax
        run: node --check onboarding-v68.js
      - name: Run static regression audit
        run: node tests/stable-candidate-audit-v68.mjs
      - name: Run v57 dashboard regression audit
        run: node tests/v57-dashboard-regression.mjs
      - name: Run v58 Live Classroom regression audit
        run: node tests/v58-live-classroom-regression.mjs
      - name: Run v59 Mobile Classroom regression audit
        run: node tests/v59-mobile-classroom-regression.mjs
      - name: Run v60 Student Experience regression audit
        run: node tests/v60-student-experience-regression.mjs
      - name: Run v61 Academic Analytics regression audit
        run: node tests/v61-academic-analytics-regression.mjs
      - name: Run v62 Admin Institutional regression audit
        run: node tests/v62-admin-institutional-regression.mjs
      - name: Run v63 Plans Entitlements regression audit
        run: node tests/v63-entitlements-regression.mjs
      - name: Run v64 Reliability Performance regression audit
        run: node tests/v64-reliability-performance-regression.mjs
      - name: Run v65 Question Studio regression audit
        run: node tests/v65-question-studio-regression.mjs
      - name: Run v66 Assignments regression audit
        run: node tests/v66-assignments-regression.mjs
      - name: Run v67 Security Commercial regression audit
        run: node tests/v67-security-commercial-regression.mjs
      - name: Run v68 Onboarding Product Activation regression audit
        run: node tests/v68-onboarding-product-activation-regression.mjs
      - name: Validate critical files exist
        run: |
          test -f teacher.html
          test -f beta.html
          test -f asistencia.html
          test -f proyectar.html
          test -f control.html
          test -f assignment.html
          test -f status.html
          test -f beta-attendance-pro-v1.js
          test -f beta-group-center-v2.js
          test -f beta-paper-exams-v2.js
          test -f beta-pilot-ready-v1.js
          test -f beta-pilot-ready-v1.css
          test -f beta-executive-v56.css
          test -f beta-pilot-ready-v57.js
          test -f beta-smart-dashboard-v57.css
          test -f live-classroom-v58.js
          test -f live-classroom-v58.css
          test -f control-v59.js
          test -f control-v59.css
          test -f student-v60.js
          test -f student-v60.css
          test -f student-security-v67.js
          test -f academic-analytics-v61.js
          test -f academic-analytics-v61.css
          test -f admin-v62.js
          test -f admin-v62.css
          test -f account-guard-v62.js
          test -f entitlements-v63.js
          test -f entitlements-v63.css
          test -f runtime-core-v64.js
          test -f question-studio-v65.js
          test -f question-studio-v65.css
          test -f assignments-v66.js
          test -f assignments-v66.css
          test -f assignment-v66.js
          test -f assignment-v66.css
          test -f security-commercial-v67.js
          test -f security-commercial-v67.css
          test -f status-v67.js
          test -f status-v67.css
          test -f onboarding-v68.js
          test -f onboarding-v68.css
          test -f tests/stable-candidate-audit-v68.mjs
          test -f tests/v57-dashboard-regression.mjs
          test -f tests/v58-live-classroom-regression.mjs
          test -f tests/v59-mobile-classroom-regression.mjs
          test -f tests/v60-student-experience-regression.mjs
          test -f tests/v61-academic-analytics-regression.mjs
          test -f tests/v62-admin-institutional-regression.mjs
          test -f tests/v63-entitlements-regression.mjs
          test -f tests/v64-reliability-performance-regression.mjs
          test -f tests/v65-question-studio-regression.mjs
          test -f tests/v66-assignments-regression.mjs
          test -f tests/v67-security-commercial-regression.mjs
          test -f tests/v68-onboarding-product-activation-regression.mjs
