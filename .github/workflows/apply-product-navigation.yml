name: Apply reviewed product navigation
on:
  push:
    branches: ['rebuild/tedvio-2-product-navigation']
    paths: ['.github/workflows/apply-product-navigation.yml']
permissions:
  contents: write
jobs:
  reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply the locally reviewed source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''.join(Path(f'.github/review/navigation-patch.part{i}').read_text() for i in (1,2,3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a771a0bb2f962898947d39ca0a44c0182ad4112e8a9a892ab9f4eae05f46cd64'
          Path('/tmp/navigation.patch').write_bytes(patch)
          PY
          git apply --check /tmp/navigation.patch
          git apply --index /tmp/navigation.patch
          git rm .github/workflows/apply-product-navigation.yml .github/review/navigation-patch.part1 .github/review/navigation-patch.part2 .github/review/navigation-patch.part3
          git diff --cached --check
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(product): five task areas, searchable tools and explicit group context'
          git push origin "HEAD:$GITHUB_REF_NAME"
