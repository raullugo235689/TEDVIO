name: Audit workspace snapshot
on:
  push:
    branches: ['rebuild/tedvio-2-audit-foundations']
    paths: ['.github/workflows/audit-workspace-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies for isolated review
        working-directory: apps/teacher-v2
        run: npm ci --no-audit --no-fund
      - name: Capture dependency findings
        working-directory: apps/teacher-v2
        run: npm audit --json > /tmp/tedvio-dependency-audit.json || test -s /tmp/tedvio-dependency-audit.json
      - name: Archive source and reproducible dependencies only
        run: |
          tar --exclude=.git -czf /tmp/tedvio-audit-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-audit-workspace
          path: |
            /tmp/tedvio-audit-workspace.tar.gz
            /tmp/tedvio-dependency-audit.json
          retention-days: 1
