name: Audit dependency remediation
on:
  push:
    branches: ['rebuild/tedvio-2-audit-foundations']
    paths: ['.github/workflows/audit-dependency-refresh.yml']
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched transitive package without major upgrades
        working-directory: apps/teacher-v2
        run: |
          npm pkg set 'overrides.source-map-js=1.2.2'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm audit --json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-remediation
          path: |
            apps/teacher-v2/package.json
            apps/teacher-v2/package-lock.json
            apps/teacher-v2/dependency-audit.json
          retention-days: 1
