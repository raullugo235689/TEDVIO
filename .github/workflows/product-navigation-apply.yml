name: Apply reviewed navigation source
on:
  push:
    branches: ['feature/commercial-workspaces-2.3']
    paths: ['.github/workflows/product-navigation-apply.yml']
permissions:
  contents: write
jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact patch and apply to the development branch
        run: |
          test "$GITHUB_REF_NAME" = 'feature/commercial-workspaces-2.3'
          git merge-base --is-ancestor b1db59aa2d5422bc74c4f2f922869eab3f1e2e72 HEAD
          python - <<'PY'
          import base64, lzma, hashlib
          from pathlib import Path
          encoded=''.join(Path(f'.github/navigation-transfer-{part}.txt').read_text().strip() for part in [1,2,3])
          patch=lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '3a4f82b9ebbe767bd52b6d6b5b47b4bebfca02a3a59003e81c6eb38d0a38d3e2', 'Patch checksum mismatch'
          Path('/tmp/navigation-reviewed.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/navigation-reviewed.patch
          git apply --unidiff-zero --index /tmp/navigation-reviewed.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(product): five teacher workspaces and contextual class workflows'
          git push origin HEAD:feature/commercial-workspaces-2.3
