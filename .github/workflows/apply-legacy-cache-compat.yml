name: Apply TEDVIO Legacy Cache Compatibility

on:
  push:
    branches: ['launch/tedvio-21-p0-readiness']
    paths:
      - '.github/scripts/apply-legacy-cache-compat.py'
      - '.github/workflows/apply-legacy-cache-compat.yml'

permissions:
  contents: write

concurrency:
  group: apply-tedvio-legacy-cache-compat
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/tedvio-21-p0-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/teacher-v2/package-lock.json
      - name: Restore explicit cache contracts
        run: |
          python .github/scripts/apply-legacy-cache-compat.py
          rm .github/scripts/apply-legacy-cache-compat.py
          rm .github/workflows/apply-legacy-cache-compat.yml
      - name: Install pinned dependencies
        working-directory: apps/teacher-v2
        run: npm ci --no-audit --no-fund
      - name: Validate TEDVIO 2.1
        working-directory: apps/teacher-v2
        run: npm run quality
      - name: Commit validated compatibility rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Compatibility rules are already current."
          else
            git commit -m "chore(vercel): preserve legacy no-store compatibility"
            git push origin HEAD:launch/tedvio-21-p0-readiness
          fi
