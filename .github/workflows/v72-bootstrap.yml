name: TEDVIO v72 Academic Workflow Bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v72-bootstrap.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize v72
        run: |
          rm -rf .v72-build
          mkdir .v72-build
          cat patches/v72-bundle.part-* > patches/v72-bundle.tar.gz
          echo '1338fd6c64761d3c04f19abd8b5eca0be071e31cf2b849472d107fd9ea18fdfa  patches/v72-bundle.tar.gz' | sha256sum -c -
          tar -xzf patches/v72-bundle.tar.gz -C .v72-build
          python .v72-build/integrate_v72.py
          rm -rf .v72-build patches
      - name: Verify v72 and compatibility
        run: |
          node --check teacher-command-center-v70.js
          node --check teacher-group-workflow-v72.js
          node --check teacher-progressive-boot-v68.js
          node --check tests/v72-academic-workflow-regression.mjs
          node tests/v72-academic-workflow-regression.mjs
          node tests/v70-classroom-os-regression.mjs
          node tests/v71-group-intelligence-regression.mjs
          node tests/v68-7-dual-theme-premium-regression.mjs
          node tests/v68-8-mobile-theme-compat-regression.mjs
          node tests/v68-4-teacher-progressive-boot-regression.mjs
          node tests/v68-5-demand-driven-performance-regression.mjs
          node tests/v68-6-teacher-core-split-regression.mjs
          node tests/ios-safari-syntax-audit.mjs
          git diff --check
      - name: Commit v72 Academic Workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'TEDVIO v72 · Academic Workflow'
          git push
