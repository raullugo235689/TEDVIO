name: Interactive Lab isolated review workspace
on:
  push:
    branches: ['feature/interactive-lab-foundations']
    paths: ['.github/workflows/interactive-lab-review-workspace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate an unapplied migration file using the CLI
        run: |
          npx --yes supabase@3.0.0 --version
          npx --yes supabase@3.0.0 migration new --help
          npx --yes supabase@3.0.0 migration new interactive_lab_foundation
      - name: Package tracked source and the empty migration, never secrets or data
        run: |
          mkdir -p /tmp/lab-review
          git archive --format=tar.gz HEAD > /tmp/lab-review/source.tar.gz
          find supabase/migrations -name '*_interactive_lab_foundation.sql' -exec cp {} /tmp/lab-review/ \;
          git rev-parse HEAD > /tmp/lab-review/source-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interactive-lab-source-review
          path: /tmp/lab-review/
          retention-days: 3
          if-no-files-found: error
