name: Prepare online form group migration
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/prepare-form-group-migration.yml'
permissions:
  contents: read
jobs:
  migration-name:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Generate migration in isolated workspace
        run: |
          supabase migration new online_forms_declared_groups
          find supabase/migrations -maxdepth 1 -name '*_online_forms_declared_groups.sql' -printf '%f\n'
