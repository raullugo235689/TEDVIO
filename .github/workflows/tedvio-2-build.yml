name: TEDVIO 2.0 Frontend Build

on:
  push:
    branches: [main, rebuild/tedvio-2, rebuild/tedvio-2-phase4a]
    paths:
      - 'apps/teacher-v2/**'
      - 'teacher-v2/**'
      - 'supabase/migrations/**'
      - '.github/workflows/tedvio-2-build.yml'
      - 'TEDVIO-2-REBUILD.md'
  pull_request:
    branches: [main]
    paths:
      - 'apps/teacher-v2/**'
      - 'teacher-v2/**'
      - 'supabase/migrations/**'
      - '.github/workflows/tedvio-2-build.yml'
      - 'TEDVIO-2-REBUILD.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tedvio-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize OMR item analytics
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/tedvio-2-phase4a'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/teacher-v2/src/core/exams.ts')
          source = path.read_text()
          old = "if (answer && answer === scalarText(question.correct_answer)) current.correct += 1;"
          new = "if (answer && answer.toUpperCase() === answerLetter(question)) current.correct += 1;"
          if old in source:
              path.write_text(source.replace(old, new))
          elif new not in source:
              raise SystemExit('No se encontró la comparación OMR esperada.')
          PY
      - name: Install pinned dependencies
        working-directory: apps/teacher-v2
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck, architecture and production build
        working-directory: apps/teacher-v2
        run: npm run quality
      - name: Verify static preview and migration
        run: |
          test -f teacher-v2/index.html
          test -d teacher-v2/assets
          test -f supabase/migrations/20260830000825_teacher_v2_phase4a_evaluations.sql
          echo '0100750e7f726689fd540f2ec74ceadd2f32c87951120c268371b6a0c9ca02cc  supabase/migrations/20260830000825_teacher_v2_phase4a_evaluations.sql' | sha256sum -c -
          ! grep -R "OPENAI\|AI_GATEWAY\|service_role" teacher-v2 apps/teacher-v2/src
      - name: Commit normalized source and preview artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/tedvio-2-phase4a'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/teacher-v2/src/core/exams.ts apps/teacher-v2/package-lock.json teacher-v2
          if git diff --cached --quiet; then
            echo "OMR analytics and preview already current."
          else
            git commit -m "fix(teacher-v2): compare OMR answers with answer letters [skip ci]"
            git push origin HEAD:rebuild/tedvio-2-phase4a
          fi
