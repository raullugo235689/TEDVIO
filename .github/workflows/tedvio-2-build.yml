name: TEDVIO 2.0 Frontend Build
# The canonical Phase 6 workflow builds once, tests that artifact in both
# browsers, then writes the verified output. This manual check never publishes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify locked source on explicit request
        working-directory: apps/teacher-v2
        run: |
          npm ci --no-audit --no-fund
          npm run quality
