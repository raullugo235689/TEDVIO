name: TEDVIO 2.0 Frontend Build

on:
  push:
    branches: [main, rebuild/tedvio-2, rebuild/tedvio-2-phase4a]
    paths:
      - 'apps/teacher-v2/**'
      - 'teacher-v2/**'
      - 'supabase/migrations/**'
      - '.phase4a-patch.part*'
      - '.github/workflows/tedvio-2-build.yml'
      - 'TEDVIO-2-REBUILD.md'
  pull_request:
    branches: [main]
    paths:
      - 'apps/teacher-v2/**'
      - 'teacher-v2/**'
      - 'supabase/migrations/**'
      - '.github/workflows/tedvio-2-build.yml'
      - 'TEDVIO-2-REBUILD.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tedvio-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize verified Phase 4A patch
        run: |
          if compgen -G '.phase4a-patch.part*' > /dev/null; then
            for part in .phase4a-patch.part*; do
              tr -d '\r\n' < "$part"
            done > /tmp/phase4a-patch.b64
            echo '16f6a37f7640416a1ad21096ec326bb5d42683deffd9585a5a7ad357058630d4  /tmp/phase4a-patch.b64' | sha256sum -c -
            base64 -d /tmp/phase4a-patch.b64 > /tmp/phase4a-patch.tar.gz
            echo '99595f5bfb39d85d8bc141d23490140a00f6b9852a1fdec1aad96f6a262a0e3a  /tmp/phase4a-patch.tar.gz' | sha256sum -c -
            tar -xzf /tmp/phase4a-patch.tar.gz
            rm -f /tmp/phase4a-patch.b64 /tmp/phase4a-patch.tar.gz .phase4a-patch.part*
          fi
      - name: Install pinned dependencies
        working-directory: apps/teacher-v2
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Typecheck, architecture and production build
        working-directory: apps/teacher-v2
        run: npm run quality
      - name: Verify static preview
        run: |
          test -f teacher-v2/index.html
          test -d teacher-v2/assets
          test -f supabase/migrations/20260830000825_teacher_v2_phase4a_evaluations.sql
          echo '0100750e7f726689fd540f2ec74ceadd2f32c87951120c268371b6a0c9ca02cc  supabase/migrations/20260830000825_teacher_v2_phase4a_evaluations.sql' | sha256sum -c -
          ! grep -R "OPENAI\|AI_GATEWAY\|service_role" teacher-v2 apps/teacher-v2/src
      - name: Commit Phase 4A source, migration and preview artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/tedvio-2-phase4a'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Phase 4A source and preview already current."
          else
            git commit -m "feat(teacher-v2): materialize Phase 4A evaluations [skip ci]"
            git push origin HEAD:rebuild/tedvio-2-phase4a
          fi
