name: Production release read-only verification
on:
  push:
    branches: ['fix/release-diagnostics-20261012']
permissions:
  contents: read
jobs:
  public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b04deb762bd2140241cc255e900123d4380a70b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check delivered public release, HTML and assets
        env:
          EXPECTED_BUILD: 13975576485e054af3ae3a668bb2af83821ee0516c85ba9052133994611118b3
        run: |
          node .github/scripts/release-integrity.mjs verify
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const dir='/tmp/tedvio-live-proof';fs.mkdirSync(dir,{recursive:true});
          const origin='https://tedvio.vercel.app',expected=process.env.EXPECTED_BUILD;
          const manifest=JSON.parse(fs.readFileSync('deployment-manifest.json','utf8'));
          const result={origin,expectedBuild:expected,checks:[],checkedAt:new Date().toISOString()};
          const targets=[['/release.json',null],['/teacher','teacher-v2/index.html'],['/teacher-v2/index.html','teacher-v2/index.html'],['/student-v2/','student-v2/index.html'],['/projection-v2/','projection-v2/index.html']];
          const js=Object.keys(manifest.files).find(file=>/^teacher-v2\/assets\/AttendanceJustificationsPage-.*\.js$/.test(file));
          assert.ok(js);targets.push([`/${js}`,js]);
          for(const [urlPath,file] of targets){
            const response=await fetch(`${origin}${urlPath}?release_check=${Date.now()}`,{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
            const bytes=Buffer.from(await response.arrayBuffer()),hash=crypto.createHash('sha256').update(bytes).digest('hex');
            const basename=(file||'release.json').replaceAll('/','_');
            fs.writeFileSync(`${dir}/${urlPath==='/teacher'?'canonical_':''}delivered_${basename}`,bytes);
            if(file)fs.copyFileSync(file,`${dir}/expected_${basename}`);
            const summary={path:urlPath,finalURL:response.url,status:response.status,contentType:response.headers.get('content-type'),bytes:bytes.length,sha256:hash,expectedHash:file?manifest.files[file]:null,matchingBytes:file?hash===manifest.files[file]:null};
            if(urlPath==='/release.json'){try{summary.release=JSON.parse(bytes);}catch{}}
            result.checks.push(summary);
          }
          fs.writeFileSync(`${dir}/verification.json`,JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          assert.ok(result.checks.every(check=>check.status===200),'Unexpected public status');
          assert.equal(result.checks[0].release?.build_id,expected);
          assert.ok(result.checks.at(-1).matchingBytes,'Bulk justification JavaScript must match the tested artifact exactly');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tedvio-production-release-verification
          path: /tmp/tedvio-live-proof/
          retention-days: 1
          if-no-files-found: warn
