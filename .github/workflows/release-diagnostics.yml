name: Production release read-only verification
on:
  push:
    branches: ['fix/release-diagnostics-20261012']
permissions:
  contents: read
jobs:
  public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8b04deb762bd2140241cc255e900123d4380a70b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public release and byte-exact application assets
        env:
          EXPECTED_BUILD: 13975576485e054af3ae3a668bb2af83821ee0516c85ba9052133994611118b3
        run: |
          node .github/scripts/release-integrity.mjs verify
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const origin='https://tedvio.vercel.app';
          const manifest=JSON.parse(fs.readFileSync('deployment-manifest.json','utf8'));
          const expected=process.env.EXPECTED_BUILD;
          assert.equal(manifest.source_hash,expected);
          const result={origin,expectedBuild:expected,checks:[],checkedAt:new Date().toISOString()};
          async function read(path){
            const response=await fetch(`${origin}${path}?release_check=${expected.slice(0,12)}-${Date.now()}`,{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
            return {response,bytes:Buffer.from(await response.arrayBuffer())};
          }
          let ready=false;
          for(let attempt=0;attempt<8;attempt++){
            const {response,bytes}=await read('/release.json');
            let release=null;try{release=JSON.parse(bytes.toString('utf8'));}catch{}
            if(response.status===200 && release?.build_id===expected && release?.version==='2.2.0'){
              result.checks.push({path:'/release.json',status:response.status,version:release.version,build:release.build_id});ready=true;break;
            }
            console.log(JSON.stringify({attempt:attempt+1,status:response.status,matchingBuild:release?.build_id===expected}));
            if(attempt<7) await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.ok(ready,'The public domain is not serving the verified 2.2.0 release');
          const targets=[['/teacher','teacher-v2/index.html'],['/student-v2/','student-v2/index.html'],['/projection-v2/','projection-v2/index.html']];
          const justificationAsset=Object.keys(manifest.files).find(file=>/^teacher-v2\/assets\/AttendanceJustificationsPage-.*\.js$/.test(file));
          assert.ok(justificationAsset,'Missing compiled bulk-justification feature');
          targets.push([`/${justificationAsset}`,justificationAsset]);
          for(const [urlPath,file] of targets){
            const {response,bytes}=await read(urlPath);
            assert.equal(response.status,200,`${urlPath} must be public HTTP 200`);
            const hash=crypto.createHash('sha256').update(bytes).digest('hex');
            assert.equal(hash,manifest.files[file],`${urlPath} differs from the browser-tested artifact`);
            result.checks.push({path:urlPath,status:response.status,sha256:hash,bytes:bytes.length});
          }
          fs.writeFileSync('/tmp/tedvio-live-release-verification.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tedvio-production-release-verification
          path: /tmp/tedvio-live-release-verification.json
          retention-days: 3
          if-no-files-found: warn
