name: Navigation isolated review workspace
on:
  push:
    branches: ['rebuild/tedvio-2-product-navigation']
    paths: ['.github/workflows/navigation-review-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned review dependencies
        working-directory: apps/teacher-v2
        run: npm ci --no-audit --no-fund
      - name: Package source and dependencies without credentials or Git metadata
        run: tar --exclude='./.git' --exclude='./.vercel' --exclude='./.env*' -czf /tmp/tedvio-navigation-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-review-workspace
          path: /tmp/tedvio-navigation-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
