name: Bootstrap TEDVIO 2.0

on:
  push:
    branches: [rebuild/tedvio-2]
    paths:
      - '.tedvio2-bootstrap.part*'
      - '.github/workflows/bootstrap-tedvio-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize unified frontend
        run: |
          cat .tedvio2-bootstrap.part* | base64 -d | tar -xzf -
          rm -f .tedvio2-bootstrap.part*
          rm -f .tedvio2-bootstrap.tar.gz.b64
          # Workflow files require a token with workflows permission. The final
          # build workflow is installed separately after this source commit.
          rm -f .github/workflows/tedvio-2-build.yml
      - name: Install and validate
        working-directory: apps/teacher-v2
        run: |
          npm install --no-audit --no-fund
          npm run quality
      - name: Commit source, lockfile and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git commit -m "feat(teacher-v2): bootstrap unified frontend [skip ci]"
          git push origin HEAD:rebuild/tedvio-2
