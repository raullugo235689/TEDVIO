name: Apply checked navigation refinements
on:
  push:
    branches: ['rebuild/tedvio-2-product-navigation']
    paths: ['.github/workflows/refine-product-navigation.yml']
permissions:
  contents: write
jobs:
  reviewed-refinements:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed print, context copy and selector changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '597a32671868c461158b45ff50b87d02a6b120c7b30ae54f0f202ba3f3275496'
          Path('/tmp/navigation-refinements.patch').write_bytes(patch)
          PY
          git apply --check /tmp/navigation-refinements.patch
          git apply --index /tmp/navigation-refinements.patch
          git rm .github/workflows/refine-product-navigation.yml
          git diff --cached --check
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(product): preserve clean printed documents and refine navigation review'
          git push origin "HEAD:$GITHUB_REF_NAME"
