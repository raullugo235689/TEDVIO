name: TEDVIO v70 Classroom OS Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax · Teacher Command Center
        run: node --check teacher-command-center-v70.js
      - name: v70 Classroom OS regression
        run: node tests/v70-classroom-os-regression.mjs
