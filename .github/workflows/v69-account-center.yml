name: TEDVIO v69 Privacy Legal Account Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax · Account Center
        run: node --check account-center-v69.js
      - name: Syntax · Theme integration
        run: node --check teacher-theme-v68-7.js
      - name: v69 Privacy Legal Account regression
        run: node tests/v69-privacy-legal-account-center-regression.mjs
