<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEDVIO · Grupos</title><link rel="stylesheet" href="./styles.css"></head><body><div id="groupsApp"><div class="join-wrap"><div class="join-card"><h2>Cargando grupos…</h2></div></div></div><script src="./config.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {createGroupsModule} from './groups.js';
const c=window.TEDVIO_CONFIG||{},sb=createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY),gm=createGroupsModule(sb),root=document.querySelector('#groupsApp');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function home(){try{await gm.load();root.innerHTML=`<div class="shell"><header class="topbar"><b>TEDVIO · Mis grupos</b></header><main class="content"><section class="hero"><div><h1>Mis grupos</h1><p>Organiza sesiones y conserva su historial.</p></div></section><section class="grid split"><div class="card"><h2>Grupos guardados</h2>${gm.state.groups.length?gm.state.groups.map(g=>`<button class="mobile-option" onclick="openGroup('${g.id}')" style="text-align:left"><b>${esc(g.name)}</b><br><small>${esc(g.subject||'')} ${esc(g.section||'')}</small></button>`).join(''):'<p>Aún no tienes grupos.</p>'}</div><div class="card"><h2>Nuevo grupo</h2><div class="field"><label>Nombre</label><input id="gn" placeholder="Anatomía 1°A"></div><div class="field"><label>Materia</label><input id="gs"></div><div class="field"><label>Sección</label><input id="gx"></div><button class="btn primary" onclick="saveGroup()">Crear grupo</button></div></section></main></div>`}catch(e){root.innerHTML=`<div class="join-wrap"><div class="join-card"><h2>No se pudieron cargar los grupos</h2><p>${esc(e.message)}</p></div></div>`}}
window.saveGroup=async()=>{try{await gm.create({name:document.querySelector('#gn').value,subject:document.querySelector('#gs').value,section:document.querySelector('#gx').value});await home()}catch(e){alert(e.message)}};
window.openGroup=async id=>{try{await gm.select(id);const g=gm.state.selected;root.innerHTML=`<div class="shell"><header class="topbar"><button class="btn secondary" onclick="homePage()">← Mis grupos</button></header><main class="content"><section class="hero"><div><h1>${esc(g.name)}</h1><p>${esc(g.subject||'')} · Código permanente ${esc(g.permanent_code)}</p></div><button class="btn primary" onclick="newSession()">+ Nueva sesión</button></section><div class="card"><h2>Historial</h2>${gm.state.sessions.length?gm.state.sessions.map(s=>`<div style="padding:14px 0;border-top:1px solid #ddd"><b>${new Date(s.created_at).toLocaleString('es-MX')}</b><br><small>${esc(s.status)} · ${esc(s.code)}</small></div>`).join(''):'<p>Sin sesiones todavía.</p>'}</div></main></div>`}catch(e){alert(e.message)}};
window.newSession=async()=>{try{const s=await gm.createSession();alert(`Sesión creada: ${s.code}`);await window.openGroup(gm.state.selected.id)}catch(e){alert(e.message)}};window.homePage=home;home();
</script></body></html>
