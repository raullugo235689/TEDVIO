<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a3b"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>TEDVIO</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css?v=13"><link rel="stylesheet" href="./beta.css?v=13"><link rel="stylesheet" href="./beta-pro-max.css?v=13">
<style>
#teacherBrandBar{display:none;position:fixed;z-index:100000;left:0;right:0;top:0;height:112px;background:#fff;align-items:center;padding:14px 28px;box-shadow:0 1px 0 rgba(7,26,59,.08)}
#teacherBrandBar img{display:block;width:min(390px,72vw);height:82px;object-fit:contain;object-position:left center}
body.teacher-login-visible #teacherBrandBar{display:flex}
body.teacher-login-visible .b-login{padding-top:132px!important;min-height:100vh!important}
body.teacher-login-visible .b-login-card{padding:42px 34px 34px!important}
body.teacher-login-visible .b-login-card .b-login-logo,body.teacher-login-visible .b-login-card>h2,body.teacher-login-visible .b-login-card>p.b-sub{display:none!important}
#teacherLoginTitle{display:none;text-align:center;font:900 clamp(38px,8vw,58px)/1 Arial,Helvetica,sans-serif;letter-spacing:2px;color:#071a3b;margin:0 0 38px}
body.teacher-login-visible #teacherLoginTitle{display:block}
@media(max-width:680px){#teacherBrandBar{height:88px;padding:10px 18px}#teacherBrandBar img{height:64px;width:min(310px,75vw)}body.teacher-login-visible .b-login{padding-top:108px!important}body.teacher-login-visible .b-login-card{padding:34px 22px 26px!important}#teacherLoginTitle{margin-bottom:30px;font-size:42px}}
</style>
</head>
<body>
<header id="teacherBrandBar"><img src="./assets/tedvio_logo_horizontal_650.png?v=13" alt="TEDVIO"></header>
<div id="betaApp"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="./config.js?v=13"></script><script src="./beta-runtime-hooks.js?v=13"></script><script type="module" src="./beta-auth-fix.js?v=13"></script><script type="module" src="./beta.js?v=13"></script><script type="module" src="./beta-academics.js?v=13"></script><script type="module" src="./beta-scoring-ui.js?v=13"></script><script type="module" src="./beta-learning.js?v=13"></script><script type="module" src="./beta-analytics-plus.js?v=13"></script><script type="module" src="./beta-ux.js?v=13"></script><script type="module" src="./beta-stability.js?v=13"></script>
<script>
(function(){
 function syncTeacherLogin(){
  const card=document.querySelector('.b-login-card');
  const isTeacher=!!(card&&card.querySelector('#authEmail')&&card.querySelector('#authPass')&&!location.hash.startsWith('#join')&&!location.hash.startsWith('#student'));
  document.body.classList.toggle('teacher-login-visible',isTeacher);
  if(!isTeacher)return;
  card.querySelectorAll('.b-login-logo,h2,p.b-sub').forEach(el=>el.style.display='none');
  let title=card.querySelector('#teacherLoginTitle');
  if(!title){title=document.createElement('div');title.id='teacherLoginTitle';title.textContent='TEDVIO';card.prepend(title)}
 }
 const obs=new MutationObserver(()=>requestAnimationFrame(syncTeacherLogin));
 obs.observe(document.getElementById('betaApp'),{childList:true,subtree:true});
 window.addEventListener('hashchange',syncTeacherLogin);syncTeacherLogin();
})();
</script>
</body></html>
