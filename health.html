<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a3b">
  <title>TEDVIO · Diagnóstico</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102038;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}.hl-shell{width:min(860px,calc(100% - 28px));margin:0 auto;padding:32px 0 50px}.hl-head{display:flex;gap:22px;align-items:center;background:#071a3b;color:#fff;border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(7,26,59,.18)}.hl-head img{width:min(220px,42vw);height:auto}.hl-head h1{font-size:clamp(28px,5vw,42px);margin:5px 0}.hl-head p{margin:0;color:#c8d5ec}.hl-pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#205eff;font-size:12px;font-weight:800}.hl-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.hl-summary>div,.hl-card{background:#fff;border:1px solid #dfe7f2;border-radius:18px;box-shadow:0 8px 28px rgba(7,26,59,.06)}.hl-summary>div{padding:16px}.hl-summary span{display:block;font-size:12px;color:#64748b}.hl-summary b{font-size:30px;color:#071a3b}.hl-card{padding:10px 18px}.hl-row{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #edf2f7}.hl-row:last-child{border-bottom:0}.hl-row strong{display:block}.hl-row small{display:block;color:#64748b;margin-top:3px;word-break:break-word}.hl-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900}.hl-dot.ok{background:#dcfce7;color:#166534}.hl-dot.fail{background:#fee2e2;color:#991b1b}.hl-dot.pending{background:#fef3c7;color:#92400e}.hl-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hl-actions a,.hl-actions button{border:0;text-decoration:none;border-radius:12px;padding:11px 15px;background:#fff;color:#071a3b;border:1px solid #d8e1ef;font-weight:800;cursor:pointer}.hl-actions a:first-child{background:#205eff;color:#fff;border-color:#205eff}.hl-foot{color:#64748b;font-size:12px;margin:18px 4px}@media(max-width:600px){.hl-shell{padding-top:14px}.hl-head{align-items:flex-start;flex-direction:column}.hl-head img{width:180px}.hl-summary{grid-template-columns:repeat(3,1fr);gap:7px}.hl-summary>div{padding:12px}.hl-summary b{font-size:25px}}
  </style>
</head>
<body>
  <div id="healthApp"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="./config.js"></script>
  <script type="module" src="./health.js?v=1"></script>
</body>
</html>
